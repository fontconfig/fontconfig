fail-if-fork-is-not-public:
  stage: sanity check
  script:
    - |
      if [ $CI_PROJECT_VISIBILITY != "public" ]; then
          echo "*************************************************************************************"
          echo "Project visibility must be set to 'public'."
          echo "Change this in $CI_PROJECT_URL/edit under 'Visibility, project features, permissions'"
          echo "*************************************************************************************"
          exit 1
      fi
  except:
    - main@fontconfig/fontconfig

check-ci-script:
  extends:
    - .fdo.ci-fairy
  stage: sanity check
  script:
    - ci-fairy generate-template --verify && exit 0 || true
    - >
      printf "%s\n" \
        "Committed gitlab-ci.yml differs from generated gitlab-ci.yml." \
        "To change the gitlab CI, edit .gitlab-ci/ci.template and/or .gitlab-ci/config.yml" \
        " and run ci-fairy generate-template. For details, see " \
        "https://freedesktop.pages.freedesktop.org/ci-templates/ci-fairy.html#templating-gitlab-ci-yml"
    - exit 1

lint-changelog-trailer:
  stage: sanity check
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - COMMIT_SHAs=$(git log origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD --format="%H")
    - ALL_SKIPPED=true
    - TRAILER_FOUND=false
    - |
      for sha in $COMMIT_SHAs; do
        COMMIT_SUMMARY=$(git log -n 1 --format="%s" $sha)
        COMMIT_BODY=$(git log -n 1 --format="%B" $sha)
        if echo "$COMMIT_SUMMARY" | grep -Eiq "^ci:"; then
          echo "ℹ️ Skipping ci commit: '$COMMIT_SUMMARY'"
          continue
        fi
        ALL_SKIPPED=false
        if echo "$COMMIT_BODY" | git interpret-trailers --parse | grep -Eiq "^Changelog\s*:"; then
          TRAILER_FOUND=true
          break
        fi
      done
    - |
      if [ "$ALL_SKIPPED" = true ]; then
        echo "✅ All commits are ci-only, skipping trailer enforcement."
      elif [ "$TRAILER_FOUND" = false ]; then
        echo "❌ ERROR: No 'Changelog:' trailer found in your MR commits!"
        echo "Please add a trailer to your commit message (e.g., 'Changelog: fixed')."
        echo "See https://docs.gitlab.com/user/project/changelogs/"
        echo "If it is not worth advertising, set skip-changelog label"
        exit 1
      else
        echo "✅ Changelog trailer found."
      fi
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_LABELS =~ /(^|,)skip-changelog(,|$)/
      when: never
    - if: $CI_MERGE_REQUEST_IID
      when: on_success

