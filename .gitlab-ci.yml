    - fedora:rawhide@container-prep

abicheck:
  stage: test
  extends:
    - .fdo.distribution-image@fedora
    - .fc_artifacts
  variables:
    FC_DISTRO_NAME: fedora
    FDO_DISTRIBUTION_VERSION: rawhide
    FDO_DISTRIBUTION_TAG: $FEDORA_TAG
  needs:
    - fedora:rawhide@container-prep
    - build-meson shared libxml2
  script:
    - |
      pip install junit_xml
      export builddir=($(pwd)/build-fontconfig-*)
      sh .gitlab-ci/abicheck.sh "${builddir[0]}"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  artifacts:
    reports:
      junit: build*/abidiff.xml


apicheck:
  stage: test
  extends:
    - .fdo.distribution-image@fedora
    - .fc_artifacts
  variables:
    FC_DISTRO_NAME: fedora
    FDO_DISTRIBUTION_VERSION: rawhide
    FDO_DISTRIBUTION_TAG: $FEDORA_TAG
  needs:
    - fedora:rawhide@container-prep
    - build-meson shared libxml2
  script:
    - pip install junit_xml
    - |
      export builddir=($(pwd)/build-fontconfig-*)
      python3 .gitlab-ci/apicheck.py -f .gitlab-ci/symbol.list -o "${builddir[0]}/apicheck.xml" "${builddir[0]}/libfontconfig.so" src/fcint.h "${builddir[0]}/fontconfig/fontconfig.h" fontconfig/fcfontations.h fontconfig/fcfreetype.h
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  artifacts:
    reports:
      junit: build*/apicheck.xml


