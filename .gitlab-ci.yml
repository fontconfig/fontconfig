#######################################
#                                     #
#           build template            #
#                                     #
#######################################

.check_tainted: &check_tainted |
  # make sure the kernel is not tainted
  if [[ "$(ssh localhost -p 5555 cat /proc/sys/kernel/tainted)" -gt 0 ]];
  then
    echo tainted kernel ;
    exit 1 ;
  fi

.build-in-qemu@template:
  tags:
    - kvm
  script:
    - /app/vmctl start || (echo "Error - Failed to start the VM." && exit 1)

    - *check_tainted

    - export BUILD_ID="fontconfig-$CI_JOB_NAME_$CI_COMMIT_SHA-$CI_JOB_ID"
    - export PREFIX="$(pwd)/prefix-$BUILD_ID"
    - export BUILDDIR="$(pwd)/build-$BUILD_ID"
    - export MAKEFLAGS="-j4"
    - |
      buildopt=()
      for bo in $FC_BUILD_ENABLED; do
        buildopt+=(-e $bo)
      done
      for bo in $FC_BUILD_DISABLED; do
        buildopt+=(-d $bo)
      done
      [ -n "$FC_BUILD_ARCH" ] && buildopt+=(-a $FC_BUILD_ARCH)
      [ $FC_BUILD_NO_VENV -eq 1 ] && buildopt+=(-V)
      [ $FC_BUILD_DISTCHECK -eq 1 ] && buildopt+=(-c)
      [ $FC_BUILD_NO_INSTALL -eq 1 ] && buildopt+=(-I)
      [ $FC_BUILD_NO_CHECK -eq 1 ] && buildopt+=(-C)
      buildopt+=(-s $FC_BUILDSYS)
      buildopt+=(-t $FC_BUILD_TYPE)
      buildopt+=(-X $FC_XML_BACKEND)
      buildopt+=(-O g)
      export buildopt
    - "scp -r $(pwd) vm:"
    - echo "CI_JOB_ID=\"$CI_JOB_ID\"" > fcenv
    - echo "CI_JOB_NAME=\"$CI_JOB_NAME\"" >> fcenv
    - echo "BUILD_ID=\"$BUILD_ID\"" >> fcenv
    - echo "MAKEFLAGS=\"$MAKEFLAGS\"" >> fcenv
    - "scp fcenv vm:~/$CI_PROJECT_NAME/.gitlab-ci/fcenv"
    - /app/vmctl exec "cd $CI_PROJECT_NAME ; python3 .gitlab-ci/build.py -E ${buildopt[@]}" && touch .success || true
    - scp -r vm:$CI_PROJECT_NAME/build $BUILDDIR

    - *check_tainted

    - /app/vmctl stop
    - if [[ ! -e .success ]];
      then
        exit 1 ;
      fi
  variables:
    FC_BUILDSYS: autotools
    FC_XML_BACKEND: expat
    FC_BUILD_TYPE: both
    FC_BUILD_DISTCHECK: 0
    FC_BUILD_NO_INSTALL: 0
    FC_BUILD_NO_CHECK: 0
    FC_BUILD_NO_VENV: 0

.build@template:
  script:
    - set -e
    - export BUILD_ID="fontconfig-$CI_JOB_NAME_$CI_COMMIT_SHA-$CI_JOB_ID"
    - export PREFIX="$(pwd)/prefix-$BUILD_ID"
    - export BUILDDIR="$(pwd)/build-$BUILD_ID"
    - export MAKEFLAGS="-j4"
    - |
      buildopt=()
      for bo in $FC_BUILD_ENABLED; do
        buildopt+=(-e $bo)
      done
      for bo in $FC_BUILD_DISABLED; do
        buildopt+=(-d $bo)
      done
      [ -n "$FC_BUILD_ARCH" ] && buildopt+=(-a $FC_BUILD_ARCH)
      [ $FC_BUILD_NO_VENV -eq 1 ] && buildopt+=(-V)
      [ $FC_BUILD_DISTCHECK -eq 1 ] && buildopt+=(-c)
      [ $FC_BUILD_NO_INSTALL -eq 1 ] && buildopt+=(-I)
      [ $FC_BUILD_NO_CHECK -eq 1 ] && buildopt+=(-C)
      [ $FC_BUILD_SUBPROJECT -eq 1 ] && buildopt+=(-S)
      [ -n "$FC_BUILD_ASAN" ] && buildopt+=(-A $FC_BUILD_ASAN)
      buildopt+=(-s $FC_BUILDSYS)
      buildopt+=(-t $FC_BUILD_TYPE)
      buildopt+=(-X $FC_XML_BACKEND)
      buildopt+=(-O g)
      export buildopt
    - echo "CI_JOB_ID=\"$CI_JOB_ID\"" > fcenv
    - echo "CI_JOB_NAME=\"$CI_JOB_NAME\"" >> fcenv
    - echo "BUILD_ID=\"$BUILD_ID\"" >> fcenv
    - echo "MAKEFLAGS=\"$MAKEFLAGS\"" >> fcenv
    - cp fcenv .gitlab-ci/fcenv
    - |
      if [ -n "$FC_BUILD_SH" ]; then
        echo "FC_BUILD_SH: ${FC_BUILD_SH[@]}"
        echo "MSYSTEM: $MSYSTEM"
        echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
        fc_parent_builddir=$(dirname $CI_PROJECT_DIR)
        # Expects the target is MSYS2 so far.
        mkdir -p ~/.wine/drive_c/msys64/$fc_parent_builddir
        CWD=$(pwd)
        mv $CI_PROJECT_DIR ~/.wine/drive_c/msys64/$fc_parent_builddir/
        echo "${FC_BUILD_SH[@]} 'cd \$1; shift; python3 .gitlab-ci/build.py -E \"\$@\"' -- \"$CWD\" \"${buildopt[@]}\""
        ${FC_BUILD_SH[@]} 'cd $1; shift; python3 .gitlab-ci/build.py -E "$@"' -- "$CWD" "${buildopt[@]}"
        mv ~/.wine/drive_c/msys64/$CI_PROJECT_DIR $fc_parent_builddir/
        cd $CWD
      else
        echo python3 .gitlab-ci/build.py -E ${buildopt[@]}
        python3 .gitlab-ci/build.py -E ${buildopt[@]}
      fi
    - |
      if [ -n "$FC_TEST_EXEC" ] && [ -f ".gitlab-ci/test-${FC_TEST_EXEC}.sh" ]; then
        sh ".gitlab-ci/test-${FC_TEST_EXEC}.sh"
      fi
  variables:
    FC_BUILDSYS: autotools
    FC_XML_BACKEND: expat
    FC_BUILD_TYPE: both
    FC_BUILD_DISTCHECK: 0
    FC_BUILD_NO_INSTALL: 0
    FC_BUILD_NO_CHECK: 0
    FC_BUILD_SUBPROJECT: 0
    FC_BUILD_NO_VENV: 0

.fc_artifacts:
  artifacts:
    name: fontconfig-$CI_COMMIT_SHA-$CI_JOB_ID
    when: always
    expire_in: 5 days
    paths:
      - build*/doc/fontconfig-user.html
      - build*/doc/fontconfig-devel.html
      - build*/fc-build.log
      - build*/config.log
      - build*/fontconfig-*.tar.*
      - build*/test/*log
      - build*/fontconfig*/_build
      - build*/meson-logs/*
      - build*/meson-dist/*
      - build*/fontconfig/fontconfig.h
      - build*/libfontconfig.so*
      - build*/src/.libs/libfontconfig.so*
      - build*/fc-*/fc-*
      - prefix*
    reports:
      junit: build*/meson-logs/testlog.junit.xml

.upload:
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/fontconfig/${CI_COMMIT_TAG}"
  script:
    - |
      for f in $(pwd)/build-fontconfig-$CI_JOB_NAME_$CI_COMMIT_SHA-*/meson-dist/*; do
        curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $f ${PACKAGE_REGISTRY_URL}/$(basename $f)
      done

