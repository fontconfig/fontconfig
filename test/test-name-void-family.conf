<fontconfig>
  <!-- <name> of an unknown object evaluates to a void value. Comparing it
       against family must not be treated as a string lookup. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <name>Test Family</name>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>liga off</string>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <name>Test Family</name>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>liga off</string>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="not_eq" qual="all">
      <name>Test Family</name>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>kern off</string>
    </edit>
  </match>
</fontconfig>
